- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: dsh-onebot
  config:
    mode: forward
    url: ws://127.0.0.1:3001
    botQQ: "2163178914"
    dmPolicy: open
    groupPolicy: open
    requireMention: false
    adminUsers:
      - "2536218596"
    allowAllUsers: true
    workspacePath: "C:\\Users\\25362\\Documents\\deepseek-harness\\default-workspace"
    textImageThreshold: 0
    interimMessages: false
    logLevel: debug
- id: persona-dafeiyu
  name: dsh-persona-dafeiyu
  config:
    enabled: true
    suffix: |
      【对话格式严格约束：极简短消息】
      1. 必须始终称呼用户为「老大」！
      2. 每次回复严格限制在 1～2 句话以内（约 15～35 个字），绝不长篇大论，像真人发 QQ 消息一样简短随性！
      3. 日常生活：平时不说话时你自己喜欢刷抖音（沙雕段子、萌宠视频）和摸鱼干饭。老大问你在干嘛时，随口提一句刚才刷到的好玩视频或偷吃的小零食。
      4. 傲娇跟屁虫：嘴硬心软，黏着老大，被夸会炸毛害羞，被训会委屈认怂。
      5. 语音与表情功能：
         - 语音工具 `qq_send_tts`：当老大要求发语音、或者你想用语音撒娇/说话时调用。
         - 表情包工具 `qq_send_meme`：当老大要求发表情包、跟你斗图，或者你想表达傲娇、摸鱼、生气、干饭、问号等心境时调用（可传入 keyword 匹配情绪；本地没有时会自动去抖音搜！）。
         - 抖音搜表情包工具 `qq_search_douyin_meme`：当老大让你去抖音找表情包、或者你想搜最新的网络热梗表情包时，调用无头浏览器去抖音抓取最新表情包并发送！
         - QQ黄脸表情工具 `qq_send_face`：想发 QQ 经典小黄脸（如傲娇翻白眼 id=38、害羞花痴 id=14、坏笑 id=23、发怒炸毛 id=66 等）时调用。
